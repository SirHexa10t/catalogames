ings", "rating_details": "", "front_page_art_enabled": true, "rating_info": null, "callout": "97% Positive on Steam\u003cbr\u003e\u003cbr\u003eAn first-person puzzle Metroidvania where acquiring new traversal gadgets continuously opens up hidden paths throughout a miniature sandbox city; Steam Deck Verified", "subscribe_text": null, "all_ratings": {"rar-rating": null, "esrb-rating": null, "pegi-rating": null, "oflc-nz-rating": null, "oflc-au-rating": null, "usk-rating": null}, "cta_badge": null, "book_preview": null, "publishers": [], "show_rating": null, "side_box_art_text": null, "third_party_subscribe_text": null, "msrp_price|money": {"currency": "USD", "amount": 19.99}, "min_price|money": {"currency": "USD", "amount": 10.0}, "subtitle_html": null, "description_text": "\u003ci\u003eSupraland Six Inches Under \u003c/i\u003e is a First-Person-Metroidvania. That means, you\u0027re in a gated world and the more abilities you gather, the more parts of the world you can access. \u003cbr\u003e- You don\u0027t need to have played other Supraland games before you play this \u003cbr\u003e- The gameplay consists of roughly 55% exploration, 40% solving puzzles and 5% combat. \u003cbr\u003e- The adventure will take between 8-20 hours. \u003cbr\u003e- Has absolutely zero skilltrees \u003cbr\u003e- Hundreds of gags \u003cbr\u003e- 2 funny gags \u003cbr\u003e\u003cbr\u003e\u003cstrong\u003e Compared to the first Supraland game: \u003c/strong\u003e \u003cbr\u003e- Half of the player abilities are the same, the other half is new \u003cbr\u003e- The puzzles are simpler in the main path; hard puzzles are mostly optional \u003cbr\u003e- There is less combat and all enemy types are new \u003cbr\u003e- Much more optional content, a lot of it only accessible after the credits \u003cbr\u003e- Almost all music was tailor made for the game while the first Supraland was using inexpensive, licensed music \u003cbr\u003e- The credits roll a few hours earlier than in the first game but there is much more significant endgame content\u003cbr\u003e\u003cbr\u003e\u003cstrong\u003e The story behind the game \u003c/strong\u003e \u003cbr\u003e\"Six Inches Under\" was a little sideproject that was established to introduce new dev team members to our tools and workflow. Essentially it\u0027s our preparation for the sequel to Supraland. \u003cbr\u003eWhile David M\u00fcnnich made the first Supraland game pretty much alone, he had a smaller role in this one. The core team for this one had 6 people. \u003cbr\u003ePretty much everyone on team built 1 or 2 regions of the game world and in that sense it is very experimental. \u003cbr\u003e\u003cbr\u003eIt was supposed to be a little DLC for Supraland , but it got a bit out of hand and got more and more ambitous. Instead of 3 months it took us 27 months to make this (Supraland 1 was in development for 16 months). \u003cbr\u003eIt can be considered \"Supraland 1.5\" because there are still a lot things from the first game, but at the same time it\u0027s a new world with a bunch of new mechanics. \u003cbr\u003e\u003cbr\u003e\u003cstrong\u003e Combat: \u003c/strong\u003e \u003cbr\u003eIf you\u0027re a fan of the first Supraland you might be interested in the approach to combat in this new game. After having learned a lot of lessons, the core concept was changed a lot and can still be considered experimental. We will surely learn some more lessons from this one for the next game.\u003cbr\u003e\u003cbr\u003eThe enemies are now much more separated from puzzles and won\u0027t get in your way there. The all new enemy types behave much more different from each other and there is no more one-fits-all solution to them. Hope you like it!", "user_ratings_css_class": "none", "wide_hero_art": false, "front_page_art": {"image_path": "images/displayitems/master_images/supralandsixinchesunder.png", "title": null, "resolved_paths": {}, "image_text": "Supraland Six Inches Under", "link": null, "badge_info": {"badge_tooltip": null, "badge_nu
